<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - ByteBite</title>
    <link rel="stylesheet" href="/bytebite/css/styles.css">
    <style>
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .nav-buttons {
            margin-bottom: 30px;
        }
        .nav-buttons a {
            display: inline-block;
            margin-right: 15px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .nav-buttons a:hover {
            background: #764ba2;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .stat-value {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
        }
        .stat-label {
            color: #999;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card.primary .stat-label {
            color: rgba(255,255,255,0.8);
        }
        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .chart-container h3 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        .chart {
            background: linear-gradient(135deg, #667eea10 0%, #764ba210 100%);
            border-radius: 5px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Analytics Dashboard</h1>
    </div>

    <div class="container">
        <div class="nav-buttons">
            <a href="/bytebite/menu">Menu</a>
            <a href="/bytebite/logout">Logout</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card primary">
                <div class="stat-label">Total Events</div>
                <div class="stat-value" id="totalEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Queue Size</div>
                <div class="stat-value" id="queueSize">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Batch Size</div>
                <div class="stat-value" id="batchSize">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Uptime</div>
                <div class="stat-value" id="uptime">100%</div>
            </div>
        </div>

        <div class="chart-container">
            <h3>Event Distribution</h3>
            <div class="chart" id="eventChart">
                <p>Loading chart data...</p>
            </div>
        </div>

        <div class="chart-container">
            <h3>System Health</h3>
            <div class="chart" id="healthChart">
                <p>Loading health data...</p>
            </div>
        </div>
    </div>

    <script src="/bytebite/js/analytics.js"></script>
</body>
</html>
