# Configure logging levels for main handlers
handlers = 1catalina.org.apache.juli.AsyncFileHandler, 2localhost.org.apache.juli.AsyncFileHandler, 3manager.org.apache.juli.AsyncFileHandler, 4host-manager.org.apache.juli.AsyncFileHandler, 5bytebite.org.apache.juli.AsyncFileHandler

.handlers = 1catalina.org.apache.juli.AsyncFileHandler, 2localhost.org.apache.juli.AsyncFileHandler

# Logging level and handler for catalina.log
1catalina.org.apache.juli.AsyncFileHandler.level = ALL
1catalina.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
1catalina.org.apache.juli.AsyncFileHandler.prefix = catalina.
1catalina.org.apache.juli.AsyncFileHandler.maxDays = 90
1catalina.org.apache.juli.AsyncFileHandler.encoding = UTF-8

# Logging level and handler for localhost.log
2localhost.org.apache.juli.AsyncFileHandler.level = ALL
2localhost.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
2localhost.org.apache.juli.AsyncFileHandler.prefix = localhost.
2localhost.org.apache.juli.AsyncFileHandler.maxDays = 90
2localhost.org.apache.juli.AsyncFileHandler.encoding = UTF-8

# Logging level and handler for manager.log
3manager.org.apache.juli.AsyncFileHandler.level = ALL
3manager.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
3manager.org.apache.juli.AsyncFileHandler.prefix = manager.
3manager.org.apache.juli.AsyncFileHandler.maxDays = 90
3manager.org.apache.juli.AsyncFileHandler.encoding = UTF-8

# Logging level and handler for host-manager.log
4host-manager.org.apache.juli.AsyncFileHandler.level = ALL
4host-manager.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
4host-manager.org.apache.juli.AsyncFileHandler.prefix = host-manager.
4host-manager.org.apache.juli.AsyncFileHandler.maxDays = 90
4host-manager.org.apache.juli.AsyncFileHandler.encoding = UTF-8

# ByteBite Application Handler - captures SLF4J logs
5bytebite.org.apache.juli.AsyncFileHandler.level = ALL
5bytebite.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
5bytebite.org.apache.juli.AsyncFileHandler.prefix = catalina.
5bytebite.org.apache.juli.AsyncFileHandler.maxDays = 90
5bytebite.org.apache.juli.AsyncFileHandler.encoding = UTF-8

# Route ByteBite application logs to catalina.log
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/bytebite].level = ALL
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/bytebite].handlers = 5bytebite.org.apache.juli.AsyncFileHandler

# Capture all com.bytebite package logs
com.bytebite.level = ALL
com.bytebite.handlers = 5bytebite.org.apache.juli.AsyncFileHandler

# Tomcat internal logging
org.apache.catalina.level = INFO
org.apache.catalina.handlers = 1catalina.org.apache.juli.AsyncFileHandler

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].handlers = 2localhost.org.apache.juli.AsyncFileHandler

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/manager].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/manager].handlers = 3manager.org.apache.juli.AsyncFileHandler

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/host-manager].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/host-manager].handlers = 4host-manager.org.apache.juli.AsyncFileHandler

# For all other loggers, use parent logger's handlers
.level = INFO

# Jasper logging
org.apache.jasper.level = INFO

# Naming logging (JNDI resources)
org.apache.naming.level = INFO

# Manager logging
org.apache.catalina.manager.level = INFO
