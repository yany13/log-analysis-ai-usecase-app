# ByteBite Network Sniffer - BPF Filter Configuration
# Captures application-layer traffic only (no system noise)
#
# Filter Explanation:
#   - port 8080: Tomcat HTTP (LoginServlet, MenuServlet, CheckoutServlet, AnalyticsServlet, KDSServlet, HealthServlet)
#   - port 8443: Tomcat HTTPS/TLS (SSL failure injection scenario)
#   - port 5432: PostgreSQL database queries (connection leaks, deadlocks, OOM queries)
#   - port 389: LDAP authentication traffic (LDAP timeouts)
#   - Excludes: DNS (53), NTP, ICMP, internal Docker networking, host-to-container management
#
# Syntax: Berkeley Packet Filter (BPF)
# Captures TCP/UDP traffic on specific ByteBite application ports

(port 8080 or port 8443 or port 5432 or port 389)
